[project]
name = "narravo-engine"
version = "0.1.0"
description = "Narravo local writing domain and versioned stdio RPC"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12,<3",
    "sqlalchemy>=2.0.43,<2.1",
    "alembic>=1.17,<2",
    "charset-normalizer>=3.4,<4",
    "httpx>=0.28,<0.29",
    "mutagen>=1.47,<2",
    "pypdf>=6.1,<7",
    "lxml>=6,<7",
    "beautifulsoup4>=4.14,<5",
]

[project.scripts]
narravo-engine = "narravo_engine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.13,<1", "mypy>=1.18,<2", "pyinstaller>=6.16,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
